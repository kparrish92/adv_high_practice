<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Advanced Mid → Advanced High</title>
<style>
:root {
  --blue: #355C8A;
  --red: #B33A3A;
  --purple: #7A5AA6;
  --purple-bg: #F1ECF7;
  --ink: #2b3035;
  --muted: #8a9299;
  --line: #e2e6e9;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; width: 100%; height: 100%;
  font-family: Arial, Helvetica, sans-serif;
  background: white; color: var(--ink);
}
button { font: inherit; }
.screen {
  width: 100vw; height: 100vh;
  display: none; flex-direction: column;
  justify-content: center; align-items: center;
  text-align: center; padding: 7vh 8vw 12vh;
}
.screen.active { display: flex; }
.prompt {
  color: var(--blue);
  font-size: 3rem;
  font-weight: 800;
  line-height: 1.25;
  max-width: 1100px;
}
.answer-en {
  color: var(--blue);
  font-size: 1.3rem;
  font-weight: 650;
  margin-bottom: 1em;
  max-width: 1050px;
  line-height: 1.35;
}
.answer-es {
  color: var(--red);
  font-size: 2.65rem;
  font-weight: 800;
  line-height: 1.3;
  max-width: 1150px;
}
.target {
  text-decoration: underline dotted 2px;
  text-underline-offset: .18em;
  cursor: pointer;
  border-radius: .14em;
  padding: 0 .03em;
}
.target.flagged {
  text-decoration-style: solid;
  background: #E8EEF5;
}
.review-target {
  color: var(--purple);
  background: var(--purple-bg);
  text-decoration: underline solid 2px;
  text-underline-offset: .18em;
  border-radius: .14em;
  padding: 0 .04em;
}
#section {
  position: fixed;
  top: 18px;
  left: 22px;
  color: #8b939a;
  font-size: .82rem;
  font-weight: 800;
  letter-spacing: .04em;
}
#progress {
  position: fixed;
  bottom: 19px;
  left: 50%;
  transform: translateX(-50%);
  color: var(--muted);
  font-size: .85rem;
}
.nav {
  position: fixed;
  bottom: 13px;
  border: 0;
  background: transparent;
  color: #6f777e;
  font-weight: 800;
  cursor: pointer;
  padding: .7em 1em;
}
.nav:disabled { opacity: .25; cursor: default; }
#back { left: 14px; }
#next { right: 14px; }
.title {
  color: var(--blue);
  font-size: 2.8rem;
  font-weight: 800;
  line-height: 1.1;
  margin-bottom: .6em;
}
.end-detail {
  color: #657078;
  line-height: 1.5;
  margin-bottom: 1.2em;
}
.controls {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
}
.primary, .secondary {
  border-radius: 9px;
  padding: .75em 1.2em;
  font-weight: 800;
  cursor: pointer;
}
.primary {
  border: 0;
  background: var(--blue);
  color: white;
}
.secondary {
  border: 1px solid var(--blue);
  background: white;
  color: var(--blue);
}
@media (max-width: 700px) {
  .screen { padding: 7vh 7vw 14vh; }
  .prompt { font-size: 2rem; }
  .answer-en { font-size: 1rem; }
  .answer-es { font-size: 1.85rem; }
  #section { top: 10px; left: 12px; font-size: .72rem; }
}

#subset-controls {
  position: fixed;
  top: 12px;
  right: 14px;
  display: flex;
  gap: 7px;
  align-items: center;
  z-index: 20;
}

#subset-controls select,
#subset-controls button {
  font: inherit;
  font-size: .78rem;
  color: #68737c;
  background: rgba(255,255,255,.94);
  border: 1px solid #d7dde2;
  border-radius: 7px;
  padding: .42em .55em;
}

#subset-controls button {
  cursor: pointer;
  font-weight: 700;
}

#subset-controls button:hover {
  border-color: #aeb8c0;
}

@media (max-width: 700px) {
  #subset-controls {
    top: 8px;
    right: 8px;
  }

  #subset-controls select,
  #subset-controls button {
    font-size: .7rem;
    padding: .36em .45em;
  }

  #section {
    max-width: 45vw;
  }
}

</style>
</head>
<body>

<div id="lesson-screen" class="screen active">
  <div id="section"></div>

  <div id="subset-controls">
    <select id="subset-size" aria-label="Practice set size">
      <option value="10">10 items</option>
      <option value="20">20 items</option>
      <option value="30">30 items</option>
      <option value="all" selected>All</option>
    </select>
    <button id="new-subset">New set</button>
  </div>

  <div id="content"></div>
  <button id="back" class="nav">← Back</button>
  <div id="progress"></div>
  <button id="next" class="nav">Next →</button>
</div>

<div id="end-screen" class="screen">
  <div id="end-title" class="title">Complete</div>
  <div id="end-detail" class="end-detail"></div>
  <div class="controls">
    <button id="review" class="primary">Extra review</button>
    <button id="repeat" class="secondary">Repeat</button>
  </div>
</div>

<script>
const ITEMS = [{"target_id": "T001", "category": "BUILDING A PARAGRAPH", "category_label": "Cohesion", "english": "First, the program is useful.", "spanish": "Primero, el programa es útil.", "spanish_spans": "Primero", "target_label_en": "first", "target_label_es": "primero", "target_type": "cohesion"}, {"target_id": "T002", "category": "BUILDING A PARAGRAPH", "category_label": "Cohesion", "english": "In addition, it is flexible.", "spanish": "Además, es flexible.", "spanish_spans": "Además", "target_label_en": "moreover / in addition", "target_label_es": "además", "target_type": "cohesion"}, {"target_id": "T003", "category": "BUILDING A PARAGRAPH", "category_label": "Cohesion", "english": "However, it is expensive.", "spanish": "Sin embargo, es caro.", "spanish_spans": "Sin embargo", "target_label_en": "however", "target_label_es": "sin embargo", "target_type": "cohesion"}, {"target_id": "T004", "category": "BUILDING A PARAGRAPH", "category_label": "Cohesion", "english": "Because of that, some students do not participate.", "spanish": "Por eso, algunos estudiantes no participan.", "spanish_spans": "Por eso", "target_label_en": "because of that / so", "target_label_es": "por eso", "target_type": "cohesion"}, {"target_id": "T005", "category": "BUILDING A PARAGRAPH", "category_label": "Cohesion", "english": "Therefore, the university should consider other options.", "spanish": "Por lo tanto, la universidad debería considerar otras opciones.", "spanish_spans": "Por lo tanto", "target_label_en": "therefore", "target_label_es": "por lo tanto", "target_type": "cohesion"}, {"target_id": "T006", "category": "BUILDING A PARAGRAPH", "category_label": "Cohesion", "english": "In other words, the problem is not the program itself.", "spanish": "En otras palabras, el problema no es el programa en sí.", "spanish_spans": "En otras palabras", "target_label_en": "in other words", "target_label_es": "en otras palabras", "target_type": "cohesion"}, {"target_id": "T007", "category": "NARRATING ACROSS TIME FRAMES", "category_label": "Time frames", "english": "At first, I thought the job would be easy.", "spanish": "Al principio, pensaba que el trabajo sería fácil.", "spanish_spans": "Al principio", "target_label_en": "at first", "target_label_es": "al principio", "target_type": "time_frame"}, {"target_id": "T008", "category": "NARRATING ACROSS TIME FRAMES", "category_label": "Time frames", "english": "At that moment, I did not know what to do.", "spanish": "En aquel momento, no sabía qué hacer.", "spanish_spans": "En aquel momento", "target_label_en": "at that moment", "target_label_es": "en aquel momento", "target_type": "time_frame"}, {"target_id": "T009", "category": "NARRATING ACROSS TIME FRAMES", "category_label": "Time frames", "english": "Since then, I have approached the problem differently.", "spanish": "Desde entonces, he abordado el problema de otra manera.", "spanish_spans": "Desde entonces", "target_label_en": "since then", "target_label_es": "desde entonces", "target_type": "time_frame"}, {"target_id": "T010", "category": "NARRATING ACROSS TIME FRAMES", "category_label": "Time frames", "english": "Over time, I learned to anticipate those problems.", "spanish": "Con el tiempo, aprendí a anticipar esos problemas.", "spanish_spans": "Con el tiempo", "target_label_en": "over time", "target_label_es": "con el tiempo", "target_type": "time_frame"}, {"target_id": "T011", "category": "NARRATING ACROSS TIME FRAMES", "category_label": "Time frames", "english": "From now on, I am going to ask for more information beforehand.", "spanish": "A partir de ahora, voy a pedir más información de antemano.", "spanish_spans": "A partir de ahora", "target_label_en": "from now on", "target_label_es": "a partir de ahora", "target_type": "time_frame"}, {"target_id": "T012", "category": "NARRATING ACROSS TIME FRAMES", "category_label": "Time frames", "english": "Later on, I would like to take on more responsibility.", "spanish": "Más adelante, me gustaría asum "}, {"target_id": "T018", "category": "PRECISION + CIRCUMLOCUTION", "category_label": "Precision & circumlocution", "english": "More specifically, the problem affects students who work full time.", "spanish": "Más concretamente, el problema afecta a los estudiantes que trabajan a tiempo completo.", "spanish_spans": "Más concretamente", "target_label_en": "more specifically", "target_label_es": "más concretamente", "target_type": "circumlocution"}, {"target_id": "T019", "category": "EXPLAINING CAUSES + CONSEQUENCES", "category_label": "Cause & consequence", "english": "The change occurred due to higher costs.", "spanish": "El cambio ocurrió debido al aumento de los costos.", "spanish_spans": "debido a", "target_label_en": "due to", "target_label_es": "debido a", "target_type": "cause_effect"}, {"target_id": "T020", "category": "EXPLAINING CAUSES + CONSEQUENCES", "category_label": "Cause & consequence", "english": "The event was canceled because of the weather.", "spanish": "El evento se canceló a causa del clima.", "spanish_spans": "a causa de", "target_label_en": "because of", "target_label_es": "a causa de", "target_type": "cause_effect"}, {"target_id": "T021", "category": "EXPLAINING CAUSES + CONSEQUENCES", "category_label": "Cause & consequence", "english": "This is due to a lack of resources.", "spanish": "Esto se debe a la falta de recursos.", "spanish_spans": "Esto se debe a", "target_label_en": "this is due to", "target_label_es": "esto se debe a", "target_type": "cause_effect"}, {"target_id": "T022", "category": "EXPLAINING CAUSES + CONSEQUENCES", "category_label": "Cause & consequence", "english": "As a consequence, fewer people participated.", "spanish": "Como consecuencia, participó menos gente.", "spanish_spans": "Como consecuencia", "target_label_en": "as a consequence", "target_label_es": "como consecuencia", "target_type": "cause_effect"}, {"target_id": "T023", "category": "EXPLAINING CAUSES + CONSEQUENCES", "category_label": "Cause & consequence", "english": "Consequently, the organization changed its strategy.", "spanish": "Por consiguiente, la organización cambió su estrategia.", "spanish_spans": "Por consiguiente", "target_label_en": "consequently", "target_label_es": "por consiguiente", "target_type": "cause_effect"}, {"target_id": "T024", "category": "EXPLAINING CAUSES + CONSEQUENCES", "category_label": "Cause & consequence", "english": "A lack of planning can lead to unnecessary problems.", "spanish": "La falta de planificación puede llevar a problemas innecesarios.", "spanish_spans": "llevar a", "target_label_en": "to lead to", "target_label_es": "llevar a", "target_type": "cause_effect"}, {"target_id": "T025", "category": "CONTRAST + CONCESSION", "category_label": "Contrast & concession", "english": "Although the system is useful, it is difficult to use.", "spanish": "Aunque el sistema es útil, es difícil de usar.", "spanish_spans": "Aunque", "target_label_en": "although / even though", "target_label_es": "aunque", "target_type": "contrast_concession"}, {"target_id": "T026", "category": "CONTRAST + CONCESSION", "category_label": "Contrast & concession", "english": "It is expensive; even so, many people use it.", "spanish": "Es caro; aun así, mucha gente lo usa.", "spanish_spans": "aun así", "target_label_en": "even so", "target_label_es": "aun así", "target_type": "contrast_concession"}, {"target_id": "T027", "category": "CONTRAST + CONCESSION", "category_label": "Contrast & concession", "english": "The first option is cheaper, whereas the second is more flexible.", "spanish": "La primera opción es más barata, mientras que la segunda es más flexible.", "spanish_spans": "mientras que", "target_label_en": "whereas", "target_label_es": "mientras que", "target_type": "contrast_concession"}, {"target_id": "T028", "category": "CONTRAST + CONCESSION", "category_label": "Contrast & concession", "english": "Some people prefer to work from home; by contrast, others prefer the office.", "spanish": "Algunas personas prefieren trabajar desde casa; en cambio, otras prefieren la oficina.", "spanish_spans": "en cambio", "target_label_en": "by contrast", "target_label_es": "en cambio", "target_type": "contrast_concession"}, {"target_id": "T029", "category": "CONTRAST + CONCESSION", "category_label": "Contrast & concession", "english": "On one hand, the change saves time.", "spanish": "Por un lado, el cambio ahorra tiempo.", "spanish_spans": "Por un lado", "target_label_en": "on one hand… on the other…", "target_label_es": "por un lado… por otro lado…", "target_type": "contrast_concession"}, {"target_id": "T030", "category": "CONTRAST + CONCESSION", "category_label": "Contrast & concession", "english": "The policy affects not only employees but also their families.", "spanish": "La política afecta no solo a los empleados, sino también a sus familias.", "spanish_spans": "no solo|sino también", "target_label_en": "not only… but also…", "target_label_es": "no solo… sino también…", "target_type": "contrast_concession"}, {"target_id": "T031", "category": "ADDING DETAIL INSIDE A SENTENCE", "category_label": "Complex sentences", "english": "The program that we use is flexible.", "spanish": "El programa que usamos es flexible.", "spanish_spans": "que", "target_label_en": "that / which / who", "target_label_es": "que", "target_type": "relative_clause"}, {"target_id": "T032", "category": "ADDING DETAIL INSIDE A SENTENCE", "category_label": "Complex sentences", "english": "The city where I grew up has changed a lot.", "spanish": "La ciudad donde crecí ha cambiado mucho.", "spanish_spans": "donde", "target_label_en": "where", "target_label_es": "donde", "target_type": "relative_clause"}, {"target_id": "T033", "category": "ADDING DETAIL INSIDE A SENTENCE", "category_label": "Complex sentences", "english": "Those who need help can request it online.", "spanish": "Quienes necesitan ayuda pueden solicitarla por internet.", "spanish_spans": "Quienes", "target_label_en": "those who / who (plural people)", "target_label_es": "quienes", "target_type": "relative_clause"}, {"target_id": "T034", "category": "ADDING DETAIL INSIDE A SENTENCE", "category_label": "Complex sentences", "english": "What worries me is the cost.", "spanish": "Lo que me preocupa es el costo.", "spanish_spans": "Lo que", "target_label_en": "what / that which", "target_label_es": "lo que", "target_type": "relative_clause"}, {"target_id": "T035", "category": "ADDING DETAIL INSIDE A SENTENCE", "category_label": "Complex sentences", "english": "The cost increased again, which created another problem.", "spanish": "El costo volvió a aumentar, lo cual creó otro problema.", "spanish_spans": "lo cual", "target_label_en": "which / and this", "target_label_es": "lo cual", "target_type": "relative_clause"}, {"target_id": "T036", "category": "ADDING DETAIL INSIDE A SENTENCE", "category_label": "Complex sentences", "english": "The proposal, whose main goal is to reduce costs, could help some families, which would be an important change.", "spanish": "La propuesta, cuyo objetivo principal es reducir los costos, podría ayudar a algunas familias, lo cual sería un cambio importante.", "spanish_spans": "cuyo", "target_label_en": "whose", "target_label_es": "cuyo/a", "target_type": "relative_clause"}, {"target_id": "T037", "category": "GENERALIZING BEYOND PERSONAL EXPERIENCE", "category_label": "Generalization", "english": "One can see the difference clearly.", "spanish": "Se puede ver la diferencia claramente.", "spanish_spans": "Se puede", "target_label_en": "one can / it is possible to", "target_label_es": "se puede", "target_type": "generalization"}, {"target_id": "T038", "category": "GENERALIZING BEYOND PERSONAL EXPERIENCE", "category_label": "Generalization", "english": "People tend to use the service in the morning.", "spanish": "Se suele usar el servicio por la mañana.", "spanish_spans": "Se suele", "target_label_en": "people tend to / it is customary to", "target_label_es": "se suele", "target_type": " ], "T052": [{"context_id": "T052-R1", "target_id": "T052", "english": "The pattern suggests that timing may be an important factor.", "spanish": "El patrón sugiere que el momento puede ser un factor importante.", "spanish_spans": "sugiere que"}, {"context_id": "T052-R2", "target_id": "T052", "english": "The result suggests that the original explanation was incomplete.", "spanish": "El resultado sugiere que la explicación original era incompleta.", "spanish_spans": "sugiere que"}], "T053": [{"context_id": "T053-R1", "target_id": "T053", "english": "Based on these observations, we can formulate a more precise question.", "spanish": "A partir de estas observaciones, podemos formular una pregunta más precisa.", "spanish_spans": "A partir de"}, {"context_id": "T053-R2", "target_id": "T053", "english": "Based on the available evidence, it is difficult to make a strong prediction.", "spanish": "A partir de la evidencia disponible, es difícil hacer una predicción firme.", "spanish_spans": "A partir de"}], "T054": [{"context_id": "T054-R1", "target_id": "T054", "english": "Put another way, the program expanded without becoming equally accessible.", "spanish": "Dicho de otro modo, el programa se amplió sin volverse igualmente accesible.", "spanish_spans": "Dicho de otro modo"}, {"context_id": "T054-R2", "target_id": "T054", "english": "Put another way, the two groups reached the same result by different paths.", "spanish": "Dicho de otro modo, los dos grupos llegaron al mismo resultado por caminos diferentes.", "spanish_spans": "Dicho de otro modo"}], "T055": [{"context_id": "T055-R1", "target_id": "T055", "english": "If this trend continues, the gap between the two groups could grow.", "spanish": "Si esta tendencia continúa, la diferencia entre los dos grupos podría aumentar.", "spanish_spans": "Si esta tendencia continúa"}, {"context_id": "T055-R2", "target_id": "T055", "english": "If this trend continues, the current system may become difficult to sustain.", "spanish": "Si azo, la política puede cambiar la manera en que la gente utiliza el servicio.", "spanish_spans": "A largo plazo"}], "T060": [{"context_id": "T060-R1", "target_id": "T060", "english": "It is not about choosing the cheapest option, but the most sustainable one.", "spanish": "No se trata de elegir la opción más barata, sino la más sostenible.", "spanish_spans": "No se trata de"}, {"context_id": "T060-R2", "target_id": "T060", "english": "It is not about eliminating risk, but about managing it more effectively.", "spanish": "No se trata de eliminar el riesgo, sino de gestionarlo de manera más eficaz.", "spanish_spans": "No se trata de|sino de"}]};

let mode = "lesson";
let items = ITEMS;
let index = 0;
let subsetSize = "all";
let showingAnswer = false;
let flagged = new Set();
let reviewItems = [];

const lessonScreen = document.getElementById("lesson-screen");
const endScreen = document.getElementById("end-screen");
const content = document.getElementById("content");
const progress = document.getElementById("progress");
const section = document.getElementById("section");
const back = document.getElementById("back");
const next = document.getElementById("next");
const reviewBtn = document.getElementById("review");
const endTitle = document.getElementById("end-title");
const endDetail = document.getElementById("end-detail");

function escapeHTML(x) {
  return String(x)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function renderSpans(sentence, spansText, targetId, review=false) {
  const spans = String(spansText || "")
    .split("|").map(x => x.trim()).filter(Boolean);

  if (!spans.length) return escapeHTML(sentence);

  let pieces = [{text: sentence, marked: false}];

  spans.forEach(span => {
    const nextPieces = [];
    pieces.forEach(piece => {
      if (piece.marked) {
        nextPieces.push(piece);
        return;
      }
      const low = piece.text.toLocaleLowerCase();
      const sl = span.toLocaleLowerCase();
      const i = low.indexOf(sl);

      if (i < 0) {
        nextPieces.push(piece);
        return;
      }

      if (i > 0) nextPieces.push({text: piece.text.slice(0,i), marked:false});
      nextPieces.push({text: piece.text.slice(i,i+span.length), marked:true});
      if (i + span.length < piece.text.length) {
        nextPieces.push({text: piece.text.slice(i+span.length), marked:false});
      }
    });
    pieces = nextPieces;
  });

  const flaggedClass = flagged.has(targetId) ? " flagged" : "";
  return pieces.map(piece => {
    if (!piece.marked) return escapeHTML(piece.text);
    const cls = review ? "review-target" : ("target" + flaggedClass);
    return `<span class="${cls}" data-target="${escapeHTML(targetId)}">${escapeHTML(piece.text)}</span>`;
  }).join("");
}


function buildSubset(size) {
  if (size === "all") {
    return [...ITEMS];
  }

  const n = Math.min(Number(size), ITEMS.length);
  const maxStart = ITEMS.length - n;
  const start = Math.floor(Math.random() * (maxStart + 1));

  return ITEMS.slice(start, start + n);
}

function startNewSubset() {
  subsetSize = document.getElementById("subset-size").value;
  items = buildSubset(subsetSize);

  mode = "lesson";
  index = 0;
  showingAnswer = false;
  flagged = new Set();

  endScreen.classList.remove("active");
  lessonScreen.classList.add("active");
  show();
}

function current() {
  return items[index];
}

function show() {
  const item = current();
  if (!item) return finish();

  const subsetControls = document.getElementById("subset-controls");

  if (mode === "lesson") {
    section.textContent = item.category_label;
    subsetControls.style.display = "flex";
  } else {
    section.textContent = "Extra review";
    subsetControls.style.display = "none";
  }

  if (!showingAnswer) {
    content.innerHTML = `<div class="prompt">${escapeHTML(item.english)}</div>`;
  } else {
    const spans = mode === "lesson" ? item.spanish_spans : item.spanish_spans;
    const tid = item.target_id;

    content.innerHTML =
      `<div class="answer-en">${escapeHTML(item.english)}</div>` +
      `<div class="answer-es">${renderSpans(item.spanish, spans, tid, mode === "review")}</div>`;

    if (mode === "lesson") {
      content.querySelectorAll(".target").forEach(el => {
        el.addEventListener("click", e => {
          e.stopPropagation();
          const id = el.dataset.target;

          if (flagged.has(id)) {
            flagged.delete(id);
          } else {
            flagged.add(id);
          }

          show();
        });
      });
    }
  }

  const slideNumber = (index * 2) + (showingAnswer ? 2 : 1);
  const totalSlides = items.length * 2;

  progress.textContent = mode === "lesson"
    ? `Slide ${slideNumber} / ${totalSlides}`
    : `Review slide ${slideNumber} / ${totalSlides}`;

  back.disabled = index === 0 && !showingAnswer;
}

function forward() {
  if (!showingAnswer) {
    showingAnswer = true;
    show();
    return;
  }

  if (index < items.length - 1) {
    index++;
    showingAnswer = false;
    show();
  } else {
    finish();
  }
}

function backward() {
  if (showingAnswer) {
    showingAnswer = false;
    show();
    return;
  }

  if (index > 0) {
    index--;
    showingAnswer = true;
    show();
  }
}

function finish() {
  lessonScreen.classList.remove("active");
  endScreen.classList.add("active");

  if (mode === "lesson") {
    endTitle.textContent = "Complete";
    const n = flagged.size;
    endDetail.textContent = n
      ? `${n} item${n === 1 ? "" : "s"} marked for extra practice.`
      : "No items were marked for extra practice.";
    reviewBtn.style.display = n ? "inline-block" : "none";
    reviewBtn.textContent = n ? `Extra review: ${n * 2} items` : "Extra review";
  } else {
    endTitle.textContent = "Review complete";
    endDetail.textContent = `${items.length} unseen examples completed.`;
    reviewBtn.style.display = "none";
  }
}

function startReview() {
  reviewItems = [];

  flagged.forEach(tid => {
    (REVIEW[tid] || []).forEach(r => {
      reviewItems.push({
        ...r,
        category_label: "Extra review"
      });
    });
  });

  for (let i = reviewItems.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [reviewItems[i], reviewItems[j]] = [reviewItems[j], reviewItems[i]];
  }

  if (!reviewItems.length) return;

  mode = "review";
  items = reviewItems;
  index = 0;
  showingAnswer = false;

  endScreen.classList.remove("active");
  lessonScreen.classList.add("active");
  show();
}

next.onclick = forward;
back.onclick = backward;
content.onclick = e => {
  if (e.target.closest(".target")) return;
  forward();
};
reviewBtn.onclick = startReview;

document.getElementById("repeat").onclick = () => {
  mode = "lesson";
  index = 0;
  showingAnswer = false;
  flagged = new Set();

  endScreen.classList.remove("active");
  lessonScreen.classList.add("active");
  show();
};

document.getElementById("new-subset").onclick = startNewSubset;

document.getElementById("subset-size").onchange = () => {
  startNewSubset();
};

document.addEventListener("keydown", e => {
  if (!lessonScreen.classList.contains("active")) return;

  if (["ArrowRight"," ","Enter"].includes(e.key)) {
    e.preventDefault();
    forward();
  }

  if (e.key === "ArrowLeft") {
    e.preventDefault();
    backward();
  }
});

show();
</script>
